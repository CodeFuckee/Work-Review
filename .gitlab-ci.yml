# GitLab CI equivalent of .github/workflows/{ci,security-audit,release}.yml.
# Required Bash shell-runner tags: linux-x64 (Ubuntu 22.04), linux-arm64 (Ubuntu
# 22.04), macos, windows. Install Node 22 and Rustup on every runner; install
# `glab` on linux-x64. Configure Tauri signing values as protected CI variables.
#
# On the Linux runners, the apt system packages are installed ONCE by an
# operator (the shell executor has no TTY, so `sudo apt-get` would block on a
# password and time out). scripts/check-linux-deps.sh only verifies them.
# Packages (Ubuntu 22.04):
#   libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
#   + (release bundling) patchelf rpm rpm2cpio cpio binutils
#   （libfuse2 不需要：tauri 打 AppImage 走 --appimage-extract-and-run）

# stages:
#   verify   三平台核验（frontend + linux/macos/windows）
#   compile  三平台 release 编译验证（按平台 needs 链式并行，提前暴露 LTO/链接问题）
#   daily-package 三平台完整安装包——仅夜间 schedule 流水线运行（artifact 保留 30 天，
#            固定 latest 下载链接指向最近一次夜间成功构建；日常 push 不再重复产包，
#            正式发版走 tag 的 package/publish，资产永久保留）
#   audit    安全审计
#   version  version-bump：verify+compile 全绿后自动版本自增（末位逢 100 进位）、
#            提交回 main（[skip ci]）并打 vX.Y.Z tag（→ 触发 preflight/package/publish）
#   preflight/package/publish  版本发布（tag 流水线，artifact 永久保留；
#            tag 提交与刚验证过的 main 仅差版本号，打包作业不再重跑验证全套）
#
# Tauri 更新签名（createUpdaterArtifacts: true）：GitLab 变量必须单行（masked
# 规则禁止换行），因此 TAURI_SIGNING_PRIVATE_KEY 存的是 minisign 私钥的
# base64（base64 -w0 < tauri-updater.key）。tauri-cli v2 (>=2.10) 会自己把
# 该值（文件路径的内容或原始字符串）按 base64 解码（见
# crates/tauri-cli/src/helpers/updater_signature.rs 的 secret_key/decode_key），
# 所以 scripts/stage-tauri-key.sh|.ps1 只把 base64 值原样落到临时文件再指向它，
# 绝不能再 base64 解码一次（否则 tauri 拿到 "untrusted comment:" 原文会报
# "failed to decode base64 secret key: Invalid symbol 32"）。
stages: [verify, compile, daily-package, audit, version, preflight, package, publish]

default:
  interruptible: true
  timeout: 3h

variables:
  RUST_VERSION: "1.97.1"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  RUSTFLAGS: "-D warnings"
  # shell runner 的构建目录跨流水线持久：git clean 保留 target/.cargo/.npm，
  # 让 cargo 指纹驱动的增量编译在流水线之间生效（此前每次 checkout 全删 +
  # cache key 漂移，三平台每条流水线全量冷启动）。注意：runner 构建目录会
  # 随时间增长（target/ 单机可达数十 GB），偶发手动清理或删除整个构建目录
  # 即可（首轮会冷构建一次）。
  GIT_CLEAN_FLAGS: -ffdx --exclude=target --exclude=.cargo --exclude=.npm
  LINUX_X64_RUNNER_TAG: linux-x64
  LINUX_ARM64_RUNNER_TAG: linux-arm64
  MACOS_RUNNER_TAG: macos
  WINDOWS_RUNNER_TAG: windows, rust
  # 无对应设备（runner）的架构默认「掠过」：设为 "true" 才启用该平台产物与发布。
  PACKAGE_LINUX_ARM64: "false"
  PACKAGE_MACOS_X64: "false"
  # 预下载的 RustSec advisory-db（在 linux-x64 runner=越秀服务器 上一次性
  # git clone https://github.com/RustSec/advisory-db <此路径>）。cargo-audit 优先
  # 用 --no-fetch 本地审计（零网络）；未预下载时回退到网络拉取（带重试）。
  ADVISORY_DB_PATH: "/opt/ci-cache/rustsec-advisory-db"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # version-bump 的提交触发 main push 流水线时应跳过（避免循环），但 tag push
    # 流水线不受影响（此时 CI_COMMIT_BRANCH 为空）——因此 tag 发布可以照常触发。
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): bump version to v/'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # 夜间定时产包流水线：.package-daily 系列作业仅接受 schedule 触发，
    # workflow 不放行 schedule 则定时流水线在创建阶段即被过滤，安装包永不产出。
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# 缓存只承担 npm 下载缓存（.npm）。Rust 的 registry（.cargo）与编译产物
# （target）由 GIT_CLEAN_FLAGS 排除后常驻 runner 构建目录，跨流水线增量生效，
# 不再进出 cache 归档（此前 target 数十 GB 进出归档每 job 分钟级，且 key 含
# src-tauri/Cargo.toml——version-bump 每次发版都改写它的版本行，key 必然漂移，
# 导致缓存形同虚设）。key 用固定值：npm 依赖变化由 package-lock.json 锁定，
# 依赖/工具链大版本调整时手动把 v1 升为 v2 即可。
cache:
  key: npm-cache-v1
  paths: [.npm/]
  policy: pull-push

.rust-node:
  before_script:
    - set -euo pipefail
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        # rustup installs to ~/.cargo/bin and registers ~/.cargo/env, but the
        # runner's PATH may not include it (observed on the linux-x64 runner:
        # "rustup: command not found"). Try the default install location.
        # shellcheck source=/dev/null
        source "$HOME/.cargo/env" 2>/dev/null || true
      fi
      if ! command -v rustup >/dev/null 2>&1; then
        echo "rustup not found. Install Rust via https://rustup.rs on this runner (linux-x64/linux-arm64/macos) or add ~/.cargo/bin to its PATH." >&2
        exit 1
      fi
    - rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
    - rustup default "$RUST_VERSION"
    - node --version
    - npm --version
    - cargo --version

# PowerShell toolchain bootstrap for the Windows runner. The gitlab-runner
# Windows service may run under an account whose PATH lacks Rust/Node, so the
# bootstrap script (scripts/windows-toolchain.ps1) locates rustup/cargo and
# node explicitly — covering the official installer, nvm-windows, scoop and
# chocolatey layouts — instead of relying on PATH alone.
.powershell-toolchain:
  before_script:
    - $ErrorActionPreference = "Stop"
    - |
      $bootstrap = Join-Path $env:CI_PROJECT_DIR "scripts\windows-toolchain.ps1"
      if (-not (Test-Path $bootstrap)) {
        throw "windows-toolchain.ps1 not found at $bootstrap"
      }
      & $bootstrap
    - rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt,clippy
    - rustup default $env:RUST_VERSION
    - node --version
    - npm --version
    - cargo --version

frontend:
  stage: verify
  tags: ["$LINUX_X64_RUNNER_TAG"]
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run check
    - npm run test:frontend
    - npm run build
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

# 夜间流水线门禁：自最新发布 tag 以来没有新提交时，通过 API 取消整条夜间流水线
# （不重复打包完全相同的产物）；有新提交时放行，各 package-daily 依赖本作业。
nightly-gate:
  stage: verify
  tags: ["$LINUX_X64_RUNNER_TAG"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  variables:
    GIT_DEPTH: "0"
  script:
    - set -euo pipefail
    - git fetch origin --tags --quiet
    - LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
    - if [ "$LATEST_TAG" = "none" ]; then echo "仓库尚无任何 tag，直接打包"; exit 0; fi
    - 'if git diff --quiet "$LATEST_TAG" HEAD; then echo "自 $LATEST_TAG 以来没有新提交，取消夜间打包"; curl -sf --request POST --header "PRIVATE-TOKEN: $GIT_PUSH_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel" > /dev/null || true; sleep 15; exit 0; fi'
    - echo "自 $LATEST_TAG 以来有新提交，继续夜间打包"

.rust-verify:
  extends: .rust-node
  stage: verify
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run build
    - cargo fmt --all -- --check
    # 独立的 cargo check 省略：clippy 是类型/借用检查的超集，避免两遍全量编译
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace --all-targets
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

rust-verify-linux:
  extends: .rust-verify
  tags: ["$LINUX_X64_RUNNER_TAG"]
  before_script:
    - !reference [.rust-node, before_script]
    - bash scripts/check-linux-deps.sh

rust-verify-macos:
  extends: .rust-verify
  tags: ["$MACOS_RUNNER_TAG"]

# This runner uses PowerShell. It must not inherit .rust-verify/.rust-node,
# because those templates contain POSIX shell commands such as `set -euo pipefail`.
rust-verify-windows:
  extends: .powershell-toolchain
  stage: verify
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - npm ci --cache $env:NPM_CONFIG_CACHE --prefer-offline
    - npm run build
    - cargo fmt --all -- --check
    # 独立的 cargo check 省略：clippy 是类型/借用检查的超集，避免两遍全量编译
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace --all-targets
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success

# ---- 三平台 release 编译验证（按平台 needs 链式并行，慢平台不再阻塞其他平台）----
.release-compile:
  extends: .rust-node
  stage: compile
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run build
    - cargo build --release -p work-review

build-release-linux:
  extends: .release-compile
  needs: [rust-verify-linux]
  tags: ["$LINUX_X64_RUNNER_TAG"]
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    expire_in: 1 week
    paths:
      - target/release/Yue_Review

build-release-macos:
  extends: .release-compile
  needs: [rust-verify-macos]
  tags: ["$MACOS_RUNNER_TAG"]
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    expire_in: 1 week
    paths:
      - target/release/Yue_Review

build-release-windows:
  extends: .powershell-toolchain
  stage: compile
  needs: [rust-verify-windows]
  tags: ["$WINDOWS_RUNNER_TAG"]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - npm ci --cache $env:NPM_CONFIG_CACHE --prefer-offline
    - npm run build
    - cargo build --release -p work-review
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    expire_in: 1 week
    paths:
      - target/release/Yue_Review.exe

# Shared pre-package steps for the Windows packaging jobs (PowerShell):
# stage the updater signing key (see scripts/stage-tauri-key.ps1).
#
# NSIS toolset placement note: the runner service executes jobs as
# LocalSystem, and tauri used to extract NSIS under systemprofile's
# AppData where the toolset exists but cannot be executed ("Unable to
# start child process, error 0x2", see tauri#9895). src-tauri/
# tauri.windows.conf.json sets bundle.useLocalToolsDir=true so the NSIS
# toolset is extracted under src-tauri/target/.tauri/NSIS instead, where
# it runs fine. The zip is SHA1-verified on every fresh download.
.windows-package-pre-steps:
  steps:
    - |
      $ErrorActionPreference = "Stop"
      & "$env:CI_PROJECT_DIR\scripts\stage-tauri-key.ps1"
      & "$env:CI_PROJECT_DIR\scripts\stage-nsis.ps1"

# ---- 日常安装包：仅夜间 schedule 流水线产三平台完整安装包 ----
# 需在 GitLab UI → CI/CD → Schedules 新建定时（每天一次、分支 main）才会运行。
# 用户可直接下载安装使用；GitLab 提供固定「latest」链接（自动指向最近一次成功构建）：
#   https://home.chenkaidi.top:509/chenkaidi/work-review/-/jobs/artifacts/main/download?job=package-daily-<os>
# artifact 保留 30 天；正式发版走 tag 的 package/publish 阶段（永久保留 + glab release）。
# 日常 push 不再产安装包：与自动发版的 Release 资产完全重复，是流水线最大耗时来源。
.package-daily:
  stage: daily-package
  # 仅 schedule 运行（push/tag/MR 一律跳过）：打安装包需要受保护变量
  # TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)，schedule 需勾选「受保护变量可见」。
  # 注意：npm run build 由 tauri 的 beforeBuildCommand 执行，不在此处显式调用。
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

package-daily-windows:
  extends: [.powershell-toolchain, .package-daily]
  needs: [nightly-gate, rust-verify-windows]
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - !reference [.windows-package-pre-steps, steps]
    - npm ci --cache $env:NPM_CONFIG_CACHE --prefer-offline
    - npm run tauri build
  after_script:
    - |
      $ErrorActionPreference = "Stop"
      $exe = Get-ChildItem -Path target -Recurse -File -Filter "Yue_Review.exe" |
        Where-Object {
          $_.FullName -match '\\release\\' -and
          $_.FullName -notmatch '\\build\\' -and
          $_.FullName -notmatch '\\deps\\'
        } |
        Select-Object -First 1
      if (-not $exe) {
        throw "Yue_Review.exe not found; cannot create the portable package."
      }
      $readme = Join-Path $exe.DirectoryName "PORTABLE_README.txt"
      @(
        "Work Review Portable",
        "",
        "- Double-click Yue_Review.exe to run; no install needed.",
        "- Requires the WebView2 Runtime (usually preinstalled on Win10/11)."
      ) | Set-Content -Path $readme -Encoding utf8
      $archive = Join-Path $exe.DirectoryName "Yue_Review_portable_x64.zip"
      Compress-Archive -Path $exe.FullName, $readme -DestinationPath $archive -Force
  artifacts:
    name: "$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - target/**/release/bundle/nsis/*.exe
      - target/**/release/bundle/nsis/*.sig
      - target/**/Yue_Review_portable_*.zip

package-daily-linux-x64:
  extends: [.rust-node, .package-daily]
  needs: [nightly-gate, rust-verify-linux]
  tags: ["$LINUX_X64_RUNNER_TAG"]
  before_script:
    - !reference [.rust-node, before_script]
    - bash scripts/check-linux-deps.sh --for-package
    - bash scripts/stage-tauri-key.sh
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run tauri build -- --bundles deb,rpm,appimage
  artifacts:
    name: "$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - target/**/release/bundle/appimage/*.AppImage
      - target/**/release/bundle/deb/*.deb
      - target/**/release/bundle/rpm/*.rpm

package-daily-linux-arm64:
  extends: [.rust-node, .package-daily]
  needs: [nightly-gate]
  tags: ["$LINUX_ARM64_RUNNER_TAG"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PACKAGE_LINUX_ARM64 == "true"'
    - when: never
  before_script:
    - !reference [.rust-node, before_script]
    - bash scripts/check-linux-deps.sh --for-package
    - bash scripts/stage-tauri-key.sh
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run tauri build -- --target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage
  artifacts:
    name: "$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - target/**/release/bundle/appimage/*.AppImage
      - target/**/release/bundle/deb/*.deb
      - target/**/release/bundle/rpm/*.rpm

package-daily-macos-arm64:
  extends: [.rust-node, .package-daily]
  needs: [nightly-gate, rust-verify-macos]
  tags: ["$MACOS_RUNNER_TAG"]
  resource_group: macos-package
  before_script:
    - !reference [.rust-node, before_script]
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - bash scripts/stage-tauri-key.sh
    # clang(Xcode 26.5)解析不了 CLT 27.0 SDK 的 tbd,而 runner 用户 shell 可能
    # 残留 SDKROOT 指向 CLT——强制对齐 xcrun 当前选择的 SDK(2026-09-14 mac 打包失败)。
    - export SDKROOT="$(xcrun --show-sdk-path)"
  variables:
    TAURI_BUILD_ARGS: "--target aarch64-apple-darwin"
    APPLE_SIGNING_IDENTITY: "-"
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run tauri build -- $TAURI_BUILD_ARGS
  artifacts:
    name: "$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - target/**/release/bundle/dmg/*.dmg
      - target/**/release/bundle/dmg/*.sig

package-daily-macos-x64:
  extends: [.rust-node, .package-daily]
  needs: [nightly-gate, rust-verify-macos]
  tags: ["$MACOS_RUNNER_TAG"]
  resource_group: macos-package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PACKAGE_MACOS_X64 == "true"'
    - when: never
  before_script:
    - !reference [.rust-node, before_script]
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - bash scripts/stage-tauri-key.sh
    # clang(Xcode 26.5)解析不了 CLT 27.0 SDK 的 tbd,而 runner 用户 shell 可能
    # 残留 SDKROOT 指向 CLT——强制对齐 xcrun 当前选择的 SDK(2026-09-14 mac 打包失败)。
    - export SDKROOT="$(xcrun --show-sdk-path)"
  variables:
    TAURI_BUILD_ARGS: "--target x86_64-apple-darwin"
    APPLE_SIGNING_IDENTITY: "-"
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run tauri build -- $TAURI_BUILD_ARGS
  artifacts:
    name: "$CI_JOB_NAME-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - target/**/release/bundle/dmg/*.dmg
      - target/**/release/bundle/dmg/*.sig

# ---- 版本自增：verify + compile 全部成功后自动 bump 版本并打 tag 发布 ----
# 规则：末位 +1，逢 100 进位（1.2.99 → 1.3.0）。同步 5 处版本源
# （package.json / package-lock.json / tauri.conf.json / src-tauri/Cargo.toml / Cargo.lock）。
# 需要 CI 变量 GIT_PUSH_TOKEN（Project Access Token，write_repository + api 权限）：
#   1) bump 提交（message 含 [skip ci]，不触发新流水线）推回 main
#   2) 打 vX.Y.Z tag 并推送 → 自动触发 preflight/package/publish 三平台发布
version-bump:
  stage: version
  tags: ["$LINUX_X64_RUNNER_TAG"]
  needs:
    - frontend
    - rust-verify-linux
    - rust-verify-macos
    - rust-verify-windows
    - build-release-linux
    - build-release-macos
    - build-release-windows
  variables:
    GIT_DEPTH: "0"
  script:
    - set -euo pipefail
    - |
      if [ -z "${GIT_PUSH_TOKEN:-}" ]; then
        echo "缺少 CI 变量 GIT_PUSH_TOKEN（Project Access Token，需 write_repository + api 权限）。" >&2
        echo "版本自增被打断：请在 GitLab → 设置 → CI/CD → 变量 中配置后重跑本 job。" >&2
        exit 1
      fi
      git fetch origin "$CI_DEFAULT_BRANCH"
      # 强化工作区恢复：前一轮 version-bump（或其它 job）可能在 runner 复用的
      # 工作区留下未推送的版本改动（曾导致五个版本源被污染成下一版本、并让
      # frontend 版本一致性测试假通过）。reset --hard + clean 保证基准绝对干净。
      git checkout -B bump-base "origin/$CI_DEFAULT_BRANCH"
      git reset --hard "origin/$CI_DEFAULT_BRANCH"
      git clean -ffdx
      echo "bump-base state: $(git rev-parse --short HEAD) $(git log -1 --oneline) $(node -p "require('./package.json').version")"
      node scripts/bump-version.mjs
      NEW_VERSION="$(node -p "require('./package.json').version")"
      git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json Cargo.lock
      git -c user.name="Work Review CI" -c user.email="ci@work-review.local" \
        commit -m "chore(release): bump version to v${NEW_VERSION}"
      git tag "v${NEW_VERSION}"
      # Git over HTTPS 不接受 PRIVATE-TOKEN header（那是 API 认证）；用 Basic auth
      # （username=oauth2, password=token）。owner/maintainer 角色 + write_repository scope 即可推。
      PUSH_AUTH="$(printf 'oauth2:%s' "${GIT_PUSH_TOKEN}" | base64 -w0)"
      git -c http.extraHeader="Authorization: Basic ${PUSH_AUTH}" \
        push origin "bump-base:${CI_DEFAULT_BRANCH}" "v${NEW_VERSION}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

cargo-audit:
  stage: audit
  tags: ["$LINUX_X64_RUNNER_TAG"]
  before_script:
    # 本作业不继承 .rust-node，但 runner 环境重置后 cargo 可能不在默认 PATH
    # （v1.1.42 tag 流水线实测 "cargo: 未找到命令"），与 .rust-node 同款兜底：
    # 先找 rustup（顺带 ~/.cargo/env），仍找不到则给安装指引。
    - set -euo pipefail
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        source "$HOME/.cargo/env" 2>/dev/null || true
      fi
      if ! command -v cargo >/dev/null 2>&1; then
        echo "cargo not found. Install Rust via https://rustup.rs on this runner (linux-x64) or add ~/.cargo/bin to its PATH." >&2
        exit 1
      fi
      cargo --version
  script:
    # 越秀服务器可预装：cargo install cargo-audit --locked
    # 已装则跳过编译（crates.io 编译每次 ~1-2 分钟，且避免网络波动）。
    - command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
    # 优先用 linux-x64 runner 上预下载的 advisory-db（--no-fetch，零网络）；
    # 未预下载则回退网络拉取——GitHub 抖动曾把发布链（preflight/package/publish）
    # 卡死在 audit 阶段，网络路径带 3 次重试。
    - |
      set -e
      AUDIT_ARGS="--ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 \
        --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 \
        --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 \
        --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 \
        --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0436 \
        --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 \
        --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100 \
        --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0258"
      if [ -d "$ADVISORY_DB_PATH/.git" ]; then
        echo "=== cargo-audit: pre-downloaded advisory-db at $ADVISORY_DB_PATH (--no-fetch) ==="
        cargo audit --no-fetch --db "$ADVISORY_DB_PATH" $AUDIT_ARGS
      else
        echo "advisory-db not found at $ADVISORY_DB_PATH, fetching from GitHub with retry."
        echo "Tip: on the linux-x64 runner run: git clone https://github.com/RustSec/advisory-db \"$ADVISORY_DB_PATH\""
        success=0
        for i in 1 2 3; do
          echo "=== cargo-audit attempt $i/3 ==="
          if cargo audit $AUDIT_ARGS; then
            echo "cargo-audit passed on attempt $i"
            success=1
            break
          fi
          if [ "$i" -lt 3 ]; then
            echo "attempt $i failed, retrying in 15s..."
            sleep 15
          fi
        done
        if [ "$success" -eq 0 ]; then
          echo "cargo-audit failed after 3 attempts" >&2
          exit 1
        fi
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes: ["**/Cargo.toml", "**/Cargo.lock", package.json, package-lock.json]

npm-audit:
  stage: audit
  tags: ["$LINUX_X64_RUNNER_TAG"]
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    # 审计告警但不阻断发布：CI 审计端的高危项无法在本地复现且无兼容修复，
    # 与 cargo-audit 的豁免策略一致，逐个漏洞建 Issue 跟踪。
    - npm audit --omit=dev --audit-level=high || true
    - npm audit || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes: ["**/Cargo.toml", "**/Cargo.lock", package.json, package-lock.json]

release-preflight:
  stage: preflight
  tags: ["$LINUX_X64_RUNNER_TAG"]
  variables:
    GIT_DEPTH: "0"
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - test "$(node -p "require('./package.json').version")" = "${CI_COMMIT_TAG#v}"
    - npm run test:frontend
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - test "$(git rev-parse "$CI_COMMIT_SHA^{commit}")" = "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

.tauri-package:
  extends: .rust-node
  stage: package
  needs: [release-preflight]
  # 不重跑 fmt/check/clippy/test：tag 指向的提交与刚在 main 全量验证过的提交
  # 仅差版本号字符串（bump 提交），验证已在 main 流水线完成——此处只构建打包。
  script:
    - npm ci --cache "$NPM_CONFIG_CACHE" --prefer-offline
    - npm run tauri build -- $TAURI_BUILD_ARGS
  artifacts:
    name: "$CI_COMMIT_TAG-$CI_JOB_NAME"
    when: always
    expire_in: never
    paths:
      - target/**/release/bundle/dmg/*.dmg
      - target/**/release/bundle/macos/*.app.tar.gz
      - target/**/release/bundle/macos/*.app.tar.gz.sig
      - target/**/release/bundle/nsis/*.exe
      - target/**/release/bundle/nsis/*.sig
      - target/**/Yue_Review_portable_*.zip
      - target/**/release/bundle/appimage/*.AppImage
      - target/**/release/bundle/deb/*.deb
      - target/**/release/bundle/rpm/*.rpm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

tauri-package-macos-arm64:
  extends: .tauri-package
  tags: ["$MACOS_RUNNER_TAG"]
  resource_group: macos-package
  before_script:
    - !reference [.rust-node, before_script]
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - bash scripts/stage-tauri-key.sh
    # clang(Xcode 26.5)解析不了 CLT 27.0 SDK 的 tbd,而 runner 用户 shell 可能
    # 残留 SDKROOT 指向 CLT——强制对齐 xcrun 当前选择的 SDK(2026-09-14 mac 打包失败)。
    - export SDKROOT="$(xcrun --show-sdk-path)"
  variables:
    TAURI_BUILD_ARGS: "--target aarch64-apple-darwin"
    APPLE_SIGNING_IDENTITY: "-"

tauri-package-macos-x64:
  extends: .tauri-package
  tags: ["$MACOS_RUNNER_TAG"]
  resource_group: macos-package
  before_script:
    - !reference [.rust-node, before_script]
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - bash scripts/stage-tauri-key.sh
    # clang(Xcode 26.5)解析不了 CLT 27.0 SDK 的 tbd,而 runner 用户 shell 可能
    # 残留 SDKROOT 指向 CLT——强制对齐 xcrun 当前选择的 SDK(2026-09-14 mac 打包失败)。
    - export SDKROOT="$(xcrun --show-sdk-path)"
  variables:
    TAURI_BUILD_ARGS: "--target x86_64-apple-darwin"
    APPLE_SIGNING_IDENTITY: "-"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $PACKAGE_MACOS_X64 == "true"'

.tauri-package-linux:
  extends: .tauri-package
  before_script:
    - !reference [.rust-node, before_script]
    - bash scripts/check-linux-deps.sh --for-package
    - bash scripts/stage-tauri-key.sh
  after_script:
    - >-
      bash scripts/check-linux-glibc.sh --max 2.35 --binary-name Yue_Review
      $(find target -type f \( -path '*/release/bundle/appimage/*.AppImage' -o -path '*/release/bundle/deb/*.deb' -o -path '*/release/bundle/rpm/*.rpm' \) | sort)

tauri-package-linux-x64:
  extends: .tauri-package-linux
  tags: ["$LINUX_X64_RUNNER_TAG"]
  variables:
    TAURI_BUILD_ARGS: "--target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage"

tauri-package-linux-arm64:
  extends: .tauri-package-linux
  tags: ["$LINUX_ARM64_RUNNER_TAG"]
  variables:
    TAURI_BUILD_ARGS: "--target aarch64-unknown-linux-gnu --bundles deb,rpm,appimage"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $PACKAGE_LINUX_ARM64 == "true"'

# This runner uses PowerShell. It must not inherit .tauri-package (which
# inherits .rust-node and its Bash `set -euo pipefail`).
tauri-package-windows:
  extends: .powershell-toolchain
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs: [release-preflight]
  # 不重跑 fmt/check/clippy/test：tag 指向的提交与刚在 main 全量验证过的提交
  # 仅差版本号字符串（bump 提交），验证已在 main 流水线完成——此处只构建打包。
  script:
    - !reference [.windows-package-pre-steps, steps]
    - npm ci --cache $env:NPM_CONFIG_CACHE --prefer-offline
    - npm run tauri build
  after_script:
    - |
      $ErrorActionPreference = "Stop"

      $exe = Get-ChildItem -Path target -Recurse -File -Filter "Yue_Review.exe" |
        Where-Object {
          $_.FullName -match '\\release\\' -and
          $_.FullName -notmatch '\\build\\' -and
          $_.FullName -notmatch '\\deps\\'
        } |
        Select-Object -First 1

      if (-not $exe) {
        throw "Yue_Review.exe not found; cannot create the portable package."
      }

      $readme = Join-Path $exe.DirectoryName "PORTABLE_README.txt"
      @(
        "Work Review Portable",
        "",
        "- Double-click Yue_Review.exe to run; no install needed.",
        "- Requires the WebView2 Runtime (usually preinstalled on Win10/11)."
      ) | Set-Content -Path $readme -Encoding utf8

      $archive = Join-Path $exe.DirectoryName "Yue_Review_portable_x64.zip"
      Compress-Archive `
        -Path $exe.FullName, $readme `
        -DestinationPath $archive `
        -Force
  artifacts:
    name: "$CI_COMMIT_TAG-$CI_JOB_NAME"
    when: always
    expire_in: never
    paths:
      - target/**/release/bundle/nsis/*.exe
      - target/**/release/bundle/nsis/*.sig
      - target/**/Yue_Review_portable_*.zip
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'

publish-release:
  stage: publish
  tags: ["$LINUX_X64_RUNNER_TAG"]
  needs:
    - job: tauri-package-macos-arm64
    - job: tauri-package-macos-x64
      optional: true
    - job: tauri-package-linux-x64
    - job: tauri-package-linux-arm64
      optional: true
    - job: tauri-package-windows
  variables:
    # jedisct1/minisign (>=0.10) 从该环境变量读取私钥口令，非交互签名。
    # （GITLAB_HOST / GITLAB_TOKEN 移到下方 before_script 里 export：
    # variables: 的服务端变量展开拿不到 CI_JOB_TOKEN——job token 由 runner
    # 在作业启动时注入，展开阶段取值为空，glab 会变成匿名调用，私有项目
    # API 一律返回 "404 Project Not Found"（v1.1.26 发布实测）。）
    MINISIGN_PASSWORD: "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
  before_script:
    - bash scripts/stage-tauri-key.sh
    # glab 认证在脚本会话内 export（variables: 展开拿不到 CI_JOB_TOKEN）。
    # 且本实例（GitLab 19.0.1）对 CI_JOB_TOKEN 调 Releases API 一律返回
    # "404 Project Not Found"（GET/POST 均匿名化，v1.1.26/v1.1.27 两次实测），
    # 故改用 version-bump 同款项目访问令牌 GIT_PUSH_TOKEN（write_repository +
    # api scope；受保护变量，tag 流水线可读，与 TAURI_SIGNING_PRIVATE_KEY 同类）。
    # 令牌缺失时回退 CI_JOB_TOKEN（标准 GitLab 实例可用）。
    - |
      if [ -n "${GIT_PUSH_TOKEN:-}" ]; then
        export GITLAB_TOKEN="$GIT_PUSH_TOKEN"
        echo ">>> glab auth: GIT_PUSH_TOKEN"
      else
        export GITLAB_TOKEN="$CI_JOB_TOKEN"
        echo ">>> glab auth: CI_JOB_TOKEN (fallback)"
      fi
      export GITLAB_HOST="$CI_SERVER_URL"
  script:
    # runner 检出工作区的 origin URL 不带端口（glab 识别为
    # "home.chenkaidi.top"），与上方 GITLAB_HOST（CI_SERVER_URL，含 :509 端口）
    # 不一致，glab 会拒绝执行："None of the git remotes configured for this
    # repository correspond to the GITLAB_HOST environment variable"
    # （v1.1.24/v1.1.25 发布失败根因）。把 origin 改写成与 GITLAB_HOST 同源
    # 的完整地址（只影响本作业工作区，不触碰 runner 配置），并配合下方
    # glab -R 显式指定仓库，双保险绕开 remote/host 匹配检查。
    - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
    - VERSION="${CI_COMMIT_TAG#v}"
    - awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md
    - test -s release_notes.md || printf '版本 %s 更新\n' "$VERSION" > release_notes.md
    # bash 默认不开 globstar，`**` 只匹配「恰好一层」目录；而 Windows 的 NSIS
    # 产物在 target/release/bundle/nsis/（target 与 release 之间零层），macOS/Linux
    # 在 target/<triple>/release/...（一层）。shopt -s globstar 让 `**` 匹配
    # 「零层或多层」目录，避免未匹配的 glob 原样传给 glab 报
    # "stat target/**/release/bundle/nsis/*.exe: no such file or directory"。
    - shopt -s globstar
    # mac runner 偶发在 artifact 上传时丢 .app.tar.gz.sig（v1.1.20 曾出现
    # "File ignored: lstat ... no such file"），对缺失的 .sig 用同一把私钥补签
    # （更新器只校验签名有效性，任何合法 minisign 签名均可）。minisign 二进制
    # 可预下载到 linux-x64 runner 的 /opt/ci-cache/bin/minisign（见下方提示），
    # 缺失且恰好有 .sig 丢失时才报错。
    - |
      set -e
      MS="$(command -v minisign 2>/dev/null || true)"
      if [ -z "$MS" ] && [ -x /opt/ci-cache/bin/minisign ]; then MS=/opt/ci-cache/bin/minisign; fi
      for f in target/**/release/bundle/macos/*.app.tar.gz target/**/release/bundle/nsis/*.exe; do
        [ -f "$f" ] || continue
        sig="${f}.sig"
        if [ ! -s "$sig" ]; then
          echo ">>> regenerating missing updater signature: $sig"
          if [ -z "$MS" ]; then
            echo "minisign not found in PATH nor /opt/ci-cache/bin/minisign" >&2
            echo "Download once on the linux-x64 runner (minisign 0.12, linux x86_64):" >&2
            echo "  curl -fL -o /tmp/minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz" >&2
            echo "  tar -xzf /tmp/minisign.tar.gz -C /tmp && install -m 755 /tmp/minisign-linux/x86_64/minisign /opt/ci-cache/bin/minisign" >&2
            exit 1
          fi
          rawkey="$(mktemp)"
          base64 -d "$TAURI_SIGNING_PRIVATE_KEY" > "$rawkey"
          "$MS" -S -s "$rawkey" -m "$f" -x "$sig"
          rm -f "$rawkey"
        fi
      done
    # 自动更新清单（updater.json）：客户端更新源已从 GitHub 切到自建 GitLab。
    # 清单里的下载地址直指 Generic Package Registry（更新器带编译期注入的
    # 只读 token 以 PRIVATE-TOKEN 头拉取清单与安装包，项目保持 private）；
    # GitLab 19 无 `latest` 包别名，客户端先查 releases API 取最新 tag，
    # 再按版本拼清单地址，因此每个 tag 必须生成并上传自己的 updater.json。
    - |
      set -e
      MAC_A64="$(ls target/**/release/bundle/macos/*_aarch64.app.tar.gz 2>/dev/null | head -n 1 || true)"
      if [ -z "$MAC_A64" ]; then
        MAC_A64="$(ls target/**/release/bundle/macos/*.app.tar.gz 2>/dev/null | grep -v '_x64' | head -n 1 || true)"
      fi
      MAC_X64="$(ls target/**/release/bundle/macos/*_x64.app.tar.gz 2>/dev/null | head -n 1 || true)"
      WIN_EXE="$(ls target/**/release/bundle/nsis/*.exe 2>/dev/null | head -n 1 || true)"
      node scripts/generate-updater-json.mjs         --version "$VERSION"         --notes-file release_notes.md         --url-base "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/generic/yue-review/$VERSION"         --out updater.json         --platform "darwin-aarch64=$MAC_A64"         --platform "darwin-x86_64=$MAC_X64"         --platform "windows-x86_64=$WIN_EXE"
    # 资产改走 Generic Package Registry：glab release create 直接挂文件生成的
    # 资产链接指向 uploads 路由（仅浏览器会话可访问，PRIVATE-TOKEN 也无效），
    # 且不带 direct_asset_path——项目公开后匿名/命令行下载仍 404（v1.1.30 实测）。
    # 包仓库对公开项目匿名可下载、永不过期；链接带 direct_asset_path 后
    # /releases/<tag>/downloads/<file> 永久路由同样生效。
    - |
      set -e
      if glab release view "$CI_COMMIT_TAG" -R "$CI_PROJECT_PATH" >/dev/null 2>&1; then
        echo ">>> release exists, skip create"
      else
        glab release create "$CI_COMMIT_TAG" -R "$CI_PROJECT_PATH" --name "Yue-Review $CI_COMMIT_TAG" --notes-file release_notes.md
      fi
      for f in target/**/release/bundle/dmg/*.dmg                target/**/release/bundle/macos/*.app.tar.gz target/**/release/bundle/macos/*.app.tar.gz.sig                target/**/release/bundle/nsis/*.exe target/**/release/bundle/nsis/*.sig                target/**/Yue_Review_portable_*.zip target/**/release/bundle/appimage/*.AppImage                target/**/release/bundle/deb/*.deb target/**/release/bundle/rpm/*.rpm updater.json; do
        [ -f "$f" ] || continue
        name="$(basename "$f")"
        # 与上方 glab 认证同款回退：GIT_PUSH_TOKEN 缺失（标准 GitLab 实例）时
        # 用 CI_JOB_TOKEN，否则空 token 上传一律 401。
        code="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT           -H "PRIVATE-TOKEN: ${GIT_PUSH_TOKEN:-$CI_JOB_TOKEN}" --data-binary "@$f"           --header 'Content-Type: application/octet-stream'           "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/generic/yue-review/$VERSION/$name")"
        case "$code" in 200|201) ;; *) echo "package upload failed ($code): $f" >&2; exit 1;; esac
        if glab api "projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links" | grep -q "\\\"name\\\":\\\"$name\\\""; then
          echo ">>> link exists, skip: $name"
          continue
        fi
        glab api -X POST           "projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"           -f "name=$name"           -f "url=$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/generic/yue-review/$VERSION/$name"           -f "direct_asset_path=/$name" >/dev/null
        echo ">>> asset linked: $name"
      done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'